- name: Deploy Django Student Portal
  hosts: web
  become: yes

  vars:
    app_dir: /home/ubuntu/app
    repo_url: "https://github.com/Hemalathaboddula/Student-course-portal.git"

  tasks:

    # ✅ Update packages
    - name: Update apt packages
      apt:
        update_cache: yes

    # ✅ Install required packages
    - name: Install required packages
      apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
          - nginx
        state: present

    # ✅ Remove old app
    - name: Remove old app
      file:
        path: "{{ app_dir }}"
        state: absent

    # ✅ Clone project
    - name: Clone repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"

    # ✅ Create virtual environment
    - name: Create virtual environment
      command: python3 -m venv "{{ app_dir }}/venv"

    # ✅ Install dependencies
    - name: Install dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"

    # ✅ Run migrations
    - name: Run migrations
      command: "{{ app_dir }}/venv/bin/python manage.py migrate"
      args:
        chdir: "{{ app_dir }}"

    # ✅ Collect static files
    - name: Collect static files
      command: "{{ app_dir }}/venv/bin/python manage.py collectstatic --noinput"
      args:
        chdir: "{{ app_dir }}"

    # ✅ Install gunicorn
    - name: Install gunicorn
      pip:
        name: gunicorn
        virtualenv: "{{ app_dir }}/venv"

    # ✅ Create Gunicorn service
    - name: Create Gunicorn service
      copy:
        dest: /etc/systemd/system/gunicorn.service
        content: |
          [Unit]
          Description=Gunicorn Django Application
          After=network.target

          [Service]
          User=ubuntu
          Group=www-data
          WorkingDirectory={{ app_dir }}
          ExecStart={{ app_dir }}/venv/bin/gunicorn learnhub.wsgi:application --bind 127.0.0.1:8000

          [Install]
          WantedBy=multi-user.target

    # ✅ Reload systemd
    - name: Reload systemd
      command: systemctl daemon-reexec

    # ✅ Start Gunicorn
    - name: Start Gunicorn
      systemd:
        name: gunicorn
        enabled: yes
        state: started

    # ✅ Configure nginx
    - name: Configure nginx
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }

    # ✅ Restart nginx
    - name: Restart nginx
      service:
        name: nginx
        state: restarted
