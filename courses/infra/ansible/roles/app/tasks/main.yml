- name: Install packages
  apt:
    update_cache: yes
    name:
      - python3-pip
      - python3-venv
      - git
      - nginx

- name: Clone repository
  git:
    repo: "https://github.com/YOUR_USERNAME/learnhub.git"
    dest: /home/ubuntu/learnhub

- name: Install dependencies
  pip:
    requirements: /home/ubuntu/learnhub/requirements.txt

- name: Run migrations
  command: python3 manage.py migrate
  args:
    chdir: /home/ubuntu/learnhub

- name: Start Django server
  command: nohup python3 manage.py runserver 0.0.0.0:8000 &
  args:
    chdir: /home/ubuntu/learnhub

- name: Copy nginx config
  copy:
    src: nginx.conf
    dest: /etc/nginx/sites-available/default

- name: Restart nginx
  service:
    name: nginx
    state: restarted