{% extends 'courses/base.html' %}

{% block content %}

<h2>Add Course</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="course_name" class="form-control mb-2" placeholder="Course Name">
    <input type="text" name="faculty_name" class="form-control mb-2" placeholder="Faculty Name">
    <input type="text" name="duration" class="form-control mb-2" placeholder="Duration">

    <button class="btn btn-success">Add Course</button>
</form>

{% endblock %}
