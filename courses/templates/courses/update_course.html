{% extends 'courses/base.html' %}

{% block content %}

<h2>Update Course</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="course_name" value="{{ course.course_name }}" class="form-control mb-2">
    <input type="text" name="faculty_name" value="{{ course.faculty_name }}" class="form-control mb-2">
    <input type="text" name="duration" value="{{ course.duration }}" class="form-control mb-2">

    <button class="btn btn-primary">Update</button>
</form>

{% endblock %}
