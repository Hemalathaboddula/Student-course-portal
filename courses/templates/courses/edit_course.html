<h2>Edit Course</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="course_name" value="{{ course.course_name }}"><br><br>
    <input type="text" name="faculty_name" value="{{ course.faculty_name }}"><br><br>
    <input type="text" name="duration" value="{{ course.duration }}"><br><br>
    <input type="url" name="course_link" value="{{ course.course_link }}"><br><br>

    <button type="submit">Update Course</button>
</form>
