{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>LearnHub</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f4f6f9;
        }

        /* ✅ Sidebar */
        .sidebar {
            position: fixed;
            width: 220px;
            height: 100%;
            background: #2f4db7;
            padding: 20px;
            color: white;
        }

        .sidebar h4 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            margin: 12px 0;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
            padding-left: 8px;
            border-radius: 6px;
        }

        /* ✅ Main Content */
        .main {
            margin-left: 240px;
            padding: 20px;
        }

        /* ✅ Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
        }

        /* ✅ Profile Circle */
        .profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- ✅ SIDEBAR -->
<div class="sidebar">
    <h4>LearnHub</h4>

    <a href="/dashboard/">🏠 Dashboard</a>

    {% if not user.is_staff %}
        <a href="/my-courses/">📚 My Courses</a>
    {% endif %}

    <a href="/logout/">🚪 Logout</a>
</div>

<!-- ✅ MAIN AREA -->
<div class="main">

    <!-- ✅ TOP HEADER -->
    <div class="topbar mb-4">

        <h4>Dashboard</h4>

        <div class="dropdown">
            <div class="profile" data-bs-toggle="dropdown">
                {{ request.user.username|slice:":2"|upper }}
            </div>

            <ul class="dropdown-menu dropdown-menu-end">
                <li class="dropdown-item"><b>{{ request.user.username }}</b></li>
                <li><hr></li>
                <li><a class="dropdown-item" href="/my-courses/">My Learning</a></li>
                <li><a class="dropdown-item text-danger" href="/logout/">Logout</a></li>
            </ul>
        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
