<!DOCTYPE html>
<html>
<head>
    <title>LearnHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            background: #2f4db7;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            margin: 10px 0;
            text-decoration: none;
        }

        .main {
            margin-left: 240px;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 10px;
        }

        .profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

<!--SIDEBAR -->
<div class="sidebar">
    <h4>LearnHub</h4>
    <a href="/dashboard/">Dashboard</a>
    <a href="/my-courses/">My Courses</a>
    <a href="/logout/">Logout</a>
</div>

<div class="main">

    <!--  HEADER -->
    <div class="topbar">
        <h4>Dashboard</h4>
        <div class="profile">
            {{ request.user.username|slice:":2"|upper }}
        </div>
    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
