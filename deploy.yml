- name: Run migrations
  command: "{{ app_dir }}/venv/bin/python manage.py migrate"
  args:
    chdir: "{{ app_dir }}"

# ✅ ADD THIS 👇
- name: Load initial data
  command: "{{ app_dir }}/venv/bin/python manage.py loaddata courses/fixtures/courses.json"
  args:
    chdir: "{{ app_dir }}"
  ignore_errors: yes